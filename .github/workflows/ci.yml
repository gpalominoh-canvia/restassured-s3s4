name: CI

# 1 · Cuándo corre
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 11 * * 1-5'          # lunes a viernes, 06:00 en Lima (11:00 UTC)
  workflow_dispatch:                # botón "Run workflow" en la pestaña Actions
    inputs:
      etiquetas:
        description: 'Filtro de etiquetas de Cucumber'
        required: true
        default: 'not @bug'


# Permisos mínimos por defecto; cada job pide lo que necesita.
permissions:
  contents: read

# Si llega otro push a la misma rama, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas de API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write                 # resumen de pruebas como "check"
      pull-requests: write          # comentario con el resumen en el PR
    steps:
      # 2 · Traer el código
      - uses: actions/checkout@v6

      # 3 · Java 17 con caché de Maven (~/.m2): la segunda vez no descarga nada
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 4 · Qué escenarios corren según el evento
      - name: Elegir etiquetas
        id: filtro
        env:
          EVENTO: ${{ github.event_name }}
          MANUAL: ${{ inputs.etiquetas }}
        run: |
          case "$EVENTO" in
            pull_request)      ETIQUETAS="@smoke and not @bug" ;;   # rápido: feedback en minutos
            workflow_dispatch) ETIQUETAS="$MANUAL" ;;
            *)                 ETIQUETAS="not @bug" ;;              # push y schedule: regresión completa
          esac
          echo "etiquetas=$ETIQUETAS" >> "$GITHUB_OUTPUT"
          echo "### Etiquetas: \`$ETIQUETAS\`" >> "$GITHUB_STEP_SUMMARY"

      # 5 · Ejecutar
      - name: Ejecutar escenarios
        env:
          ETIQUETAS: ${{ steps.filtro.outputs.etiquetas }}
        run: mvn -B test "-Dcucumber.filter.tags=$ETIQUETAS"
      
      # 6 · Resumen de pruebas en la pestaña del job y como comentario en el PR (aunque haya fallos)
      - name: Resumen de pruebas
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: target/cucumber-junit.xml
          check_name: Resultados de Cucumber
          include_passed: true
          detailed_summary: true
          comment: ${{ github.event_name == 'pull_request' }}

      # 7 · Reportes como artefacto descargable (aunque haya fallos)
      - name: Guardar reportes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: reportes-cucumber
          path: |
            target/cucumber-report.html
            target/cucumber.json
            target/cucumber-junit.xml
            target/surefire-reports/
          retention-days: 14
      
      # 8 · Preparar el sitio de GitHub Pages (solo en develop, la rama por defecto; nunca en un PR)
      - name: Preparar sitio del reporte
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' }}
        run: |
          mkdir -p sitio
          cp target/cucumber-report.html sitio/index.html
      - name: Subir sitio para Pages
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: sitio

  # 9 · Publicar el reporte en https://<usuario>.github.io/<repo>/
  publicar-reporte:
    name: Publicar reporte en GitHub Pages
    needs: pruebas
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write                  # publicar en Pages
      id-token: write               # identificar el despliegue
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v4