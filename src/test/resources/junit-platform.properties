cucumber.publish.quiet=true

# Por defecto NO corren los escenarios @bug: describen el comportamiento correcto y hoy fallan
# porque la API tiene bugs reales (ver BUGS.md). Así `mvn test` queda en verde.
# Una propiedad -D gana a este archivo:
#   mvn test "-Dcucumber.filter.tags=@bug"                 -> solo los bugs (fallan a propósito)
#   mvn test "-Dcucumber.filter.tags=@smoke and not @bug"  -> lo que corre en cada Pull Request
cucumber.filter.tags=not @bug